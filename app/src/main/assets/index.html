<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jio AI Pro</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: Arial, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .circle-panel {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #0b0f19, #1a1a2e);
            border: 5px solid transparent;
            border-radius: 50%;
            background-image: linear-gradient(#1a1a2e, #1a1a2e), linear-gradient(135deg, #00ffcc, #ff00ff, #00ffff);
            background-origin: border-box;
            background-clip: content-box, border-box;
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
        }
        .header {
            font-size: 15px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 4px;
            letter-spacing: 2px;
        }
        .period {
            font-size: 13px;
            color: #ffcc00;
            margin-bottom: 6px;
        }
        .big-small {
            font-size: 36px;
            font-weight: 900;
            color: #ff00ff;
            margin-bottom: 4px;
            text-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
        }
        .digit-label {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 1.5px;
        }
        .digit {
            font-size: 38px;
            font-weight: bold;
            color: #00ffff;
            margin-bottom: 12px;
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.8);
        }
        .btn-container {
            display: flex;
            gap: 12px;
        }
        button {
            padding: 8px 18px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .execute-btn { background: #00ffcc; color: #000; }
        .hide-btn { background: #ffaa00; color: #000; }
    </style>
</head>
<body>

    <div class="circle-panel">
        <div class="header">JIO AI PRO</div>
        <div class="period" id="periodText">PER: Loading...</div>
        
        <div class="big-small" id="predictionText">WAIT...</div>
        <div class="digit-label">LUCKY DIGIT</div>
        <div class="digit" id="digitText">-</div>

        <div class="btn-container">
            <button class="execute-btn" onclick="executeAction()">EXECUTE</button>
            <button class="hide-btn" onclick="minimizeApp()">HIDE</button>
        </div>
    </div>

    <script>
        function updatePanel() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const istTime = new Date(utc + (3600000 * 5.5));

            const year = istTime.getFullYear();
            const month = String(istTime.getMonth() + 1).padStart(2, '0');
            const day = String(istTime.getDate()).padStart(2, '0');
            
            const hours = istTime.getHours();
            const minutes = istTime.getMinutes();
            const totalMins = (hours * 60) + minutes;

            const periodSeq = 10000 + totalMins + 1;
            const periodCode = `${year}${month}${day}1000${periodSeq}`;

            document.getElementById("periodText").innerText = `PER: ${periodCode}`;

            const lastDigit = parseInt(periodCode.slice(-1));
            const isBig = lastDigit >= 5;

            document.getElementById("predictionText").innerText = isBig ? "BIG" : "SMALL";
            document.getElementById("digitText").innerText = lastDigit;
        }

        updatePanel();
        setInterval(updatePanel, 1000);

        function executeAction() {
            alert("AI Synced Successfully!");
        }

        function minimizeApp() {
            if (window.Android && window.Android.minimizePanel) {
                window.Android.minimizePanel();
            }
        }
    </script>
</body>
</html>
